<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三种学习范式分一分</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:8px; margin-top:8px; }
.card { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; }
.card .s { font-weight:600; margin-bottom:6px; }
.card .opts { display:flex; flex-wrap:wrap; gap:4px; }
.card .opts button { font-size:12px; padding:2px 8px; border-color:var(--line); color:var(--ink); }
.card.right { border-color:var(--pos); background:#f1f8e9; }
.card.wrong { border-color:var(--neg); background:#fff5f5; }
.card .why { font-size:12px; margin-top:6px; color:var(--ink); display:none; }
.card.right .why, .card.wrong .why { display:block; }
.card button.pick.ok { background:var(--pos); border-color:var(--pos); color:#fff; }
.card button.pick.bad { background:var(--neg); border-color:var(--neg); color:#fff; }
.sum { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
@media (max-width:620px) { .sum { grid-template-columns:repeat(2, 1fr); } }
.sum div { border:1px solid var(--line); border-radius:6px; padding:6px; font-size:12px; text-align:center; }
.sum b { display:block; font-size:16px; color:var(--accent); }
</style>
</head>
<body>
<h1>三种学习范式分一分：这件事该用哪一种机器学习？</h1>
<div class="sub">读每个场景，点你认为对的类别，马上能看到对错和理由。判断的关键：训练数据里有没有“标准答案”（标签）？答案是一个类别还是一个数？还是靠试错拿奖励？</div>
<div class="row">
  <span class="big" id="score">答对 0 / 12</span><span class="note" id="hint" style="margin:0">已答 0 题</span>
  <button id="reset">重做</button>
</div>
<div class="cards" id="cards"></div>
<div class="box">
  <h2>你的分类结果</h2>
  <div class="sum" id="sum"></div>
</div>
<div class="note">场景对应教材 1.3 节；“分类”“回归”都属于监督学习。</div>
<script>
(function () {
  var C = ["监督学习·分类", "监督学习·回归", "无监督学习", "强化学习"];
  var S = [
    ["判断一条短信是不是垃圾短信", 0, "有大量标好“垃圾 / 正常”的短信可以学，答案是两个类别之一。"],
    ["预测一套二手房能卖多少万元", 1, "历史成交记录里有成交价（标签），答案是一个连续的数。"],
    ["根据胸部 CT 判断有没有肺结节", 0, "医生标注过的影像是标签，答案是“有 / 没有”。"],
    ["外卖平台预测这一单多少分钟送到", 1, "过去每一单的实际送达时间就是标签，答案是一个数。"],
    ["把 10 万名会员按消费习惯分成几群，事先不知道该分几类", 2, "没有标签，让算法自己找“谁和谁像”，这是聚类。"],
    ["机器人在模拟环境里反复摔倒、爬起，最后学会走路", 3, "没有现成的标准动作，靠“走得越远奖励越多”在试错中学习。"],
    ["预测哪些手机用户下个月会销号转网", 0, "历史上每个用户有没有流失是标签，答案是“流失 / 不流失”。"],
    ["发现“买了尿不湿的顾客也常买啤酒”这类购物规律", 2, "小票上没有标签，算法自己找经常一起出现的商品，这是关联规则。"],
    ["围棋程序通过和自己下几百万盘棋不断提高棋力", 3, "每盘棋只有最后的输赢作为奖励，程序在对弈中调整策略。"],
    ["预测某门店明天卖出多少杯奶茶", 1, "过去每天的实际销量是标签，答案是一个数；这类问题也叫时间序列预测（第 12 章）。"],
    ["识别信封上手写的邮政编码数字", 0, "每张数字图片都标了 0～9 中的哪一个，是 10 个类别的多分类。"],
    ["在几百万笔交易里找出和其他交易都不一样的可疑交易，事先没人标过", 2, "没有欺诈标签，只能找“离群”的交易，这是异常检测（第 8 章）。"]
  ];
  var ans = {};
  function render() {
    var box = document.getElementById("cards"); box.innerHTML = "";
    S.forEach(function (s, i) {
      var d = document.createElement("div"); d.className = "card";
      var a = ans[i];
      if (a !== undefined) d.className += a === s[1] ? " right" : " wrong";
      d.innerHTML = '<div class="s">' + (i + 1) + ". " + s[0] + '</div><div class="opts"></div><div class="why">' +
        (a === s[1] ? "✓ " : "✗ 应该是“" + C[s[1]] + "”。") + s[2] + "</div>";
      C.forEach(function (c, k) {
        var b = document.createElement("button"); b.textContent = c; b.className = "pick";
        if (a !== undefined) { if (k === s[1]) b.className += " ok"; else if (k === a) b.className += " bad"; }
        b.onclick = function () { ans[i] = k; render(); };
        d.querySelector(".opts").appendChild(b);
      });
      box.appendChild(d);
    });
    var done = Object.keys(ans).length, right = 0, cnt = [0, 0, 0, 0];
    Object.keys(ans).forEach(function (i) { if (ans[i] === S[i][1]) right++; cnt[ans[i]]++; });
    document.getElementById("score").textContent = "答对 " + right + " / " + S.length;
    document.getElementById("hint").textContent = done < S.length ? "已答 " + done + " 题" :
      (right === S.length ? "全对！试着自己再想一个例子。" : "还有 " + (S.length - right) + " 题判错，看看红框里的理由。");
    document.getElementById("sum").innerHTML = C.map(function (c, k) {
      var truth = S.filter(function (s) { return s[1] === k; }).length;
      return "<div>" + c + "<b>" + cnt[k] + "</b>正确答案 " + truth + " 个</div>";
    }).join("");
  }
  document.getElementById("reset").onclick = function () { ans = {}; render(); };
  render();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
