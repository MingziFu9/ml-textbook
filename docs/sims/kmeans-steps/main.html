<h1>K-Means 迭代：一步步看中心移动、点重新分组</h1>
<div class="sub">数据与实验 8-2 相同（标准化后的 300 个点）。按“下一步”交替执行“分组”和“更新中心”，直到中心不再移动。换一组初始中心，看结果是否相同。</div>
<div class="row ex"><span class="lbl">数据：</span><button data-set="blobs" class="on">球形（3 群）</button><button data-set="dens">密度不同</button><button data-set="moons">月牙形</button></div>

<canvas id="cv" width="760" height="460"></canvas>
<div class="kpi"><div>当前步骤<b id="phase"></b></div><div>已迭代轮数<b id="it"></b></div><div>簇内平方和（越小越紧凑）<b id="sse"></b></div></div>

<div class="note">算法：①随机选 K 个样本作为初始中心；②每个点分到最近的中心；③每个中心移到本组点的平均位置；重复②③直到分组不再变化。scikit-learn 默认用更聪明的 k-means++ 选初始中心，并试 10 次取簇内平方和最小的一次（n_init=10）。</div>
