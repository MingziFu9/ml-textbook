# 第 6 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 6
online: 3
offline: 3
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出支持向量机、间隔、支持向量、软间隔、核函数、RBF 核的含义
  - 解释为什么要找间隔最大的分界线，惩罚参数 C 和 gamma 变大、变小时模型怎样变化，核技巧为什么能处理线性不可分的数据
  skill:
  - 运用 scikit-learn 的 `SVC` 训练线性核和 RBF 核的支持向量机，画出决策边界和支持向量，用交叉验证选择 C 和 gamma
  - 分析不同核函数、不同参数下的决策边界，判断欠拟合与过拟合；在手写数字识别中查看被认错的图片，分析原因
  - 根据数据规模、特征类型和业务要求，判断一个任务适不适合用支持向量机
  quality:
  - 体会“留有余地”的工程思想：最宽的路对新情况容忍度最大，不为个别异常数据牺牲整体
  - 养成先做数据缩放、再与简单基线比较的规范习惯，客观看待“哪个模型最好”
key_points:
- 最大间隔分类器
- 软间隔与惩罚参数 C
- 核技巧
- 支持向量回归
difficulties:
- point: 间隔、支持向量的含义，为什么分界线只由支持向量决定
  solution: 用“修路”比喻和 3 个点的手算例子，算出 A、C 在路边线上、B 在路外；再用“SVM 间隔与核函数”动画分别拖动有绿圈和没有绿圈的点，观察边界是否变化
- point: 核技巧和 C、gamma 两个参数的作用，学生容易把 C 的方向与岭回归 alpha 弄混
  solution: 用同心圆加 r² 特征的例子把“抬高一维再切一刀”讲直观；用距离 0.5、1、2 时 γ = 1 和 10 的核函数值表说明 gamma 是影响范围；结合实验 6-2 的 C × gamma 交叉验证表找欠拟合区和过拟合区
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 54
    content: 阅读网页教材第 6 章 支持向量机的情景导入和第一节，操作交互动画“SVM 间隔与核函数”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 6
    content: 情景导入：小周所在的公司接了一个银行的项目：银行每天要处理大量纸质单据，上面手写的金额、账号要由柜员一个个录入系统，又慢又容易出错……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 用银行单据手写数字识别引入，SVM 不调参就胜过前两章的模型，激发学习兴趣
  - name: 讲授
    minutes: 12
    content: 6.1 最大间隔分类器：能把两类分开的直线有无数条、间隔与支持向量、SVM 要解的问题
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 比喻 + 手算建立最大间隔和支持向量的直观认识，对应人工智能应用工程师“机器学习”考点
  - name: 讲授
    minutes: 15
    content: 6.2 软间隔与惩罚参数 C：允许少数样本越界、惩罚参数 C、别忘了标准化
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 结合实验 6-1 的图表理解 C 的作用和异常点的影响，强调 SVM 必须标准化
  - name: 讲授与演示
    minutes: 20
    content: 6.3 核技巧：把数据“抬”到高维再切一刀、核函数、常用核函数、gamma 与 C 的组合
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“SVM 间隔与核函数”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 本章重点和难点，例子 + 动画 + 交叉验证表三步突破核技巧、gamma 和调参
  - name: 讲授
    minutes: 8
    content: 6.5 SVM 的优缺点与适用场景：多分类、手写数字识别、优缺点与适用场景
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用手写数字对比结果归纳 SVM 的适用场景，培养按任务选模型的意识
  - name: 实验
    minutes: 30
    content: 实验 6-1 线性 SVM 与参数 C
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成①～③部分，第④部分标准化对比课后完成
  - name: 实验
    minutes: 30
    content: 实验 6-2 核函数与非线性分类
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成①～③部分，第④部分支持向量回归课后完成
  - name: 课堂练习
    minutes: 8
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 6
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 81
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 6.4 支持向量回归和 6.6 前沿视窗；完成实验 6-1、6-2 的剩余部分；选做实验 6-3 手写数字识别
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“修路”的比喻解释支持向量机的最大间隔思想，并说明什么是支持向量、为什么删除非支持向量不会改变决策边界。
- 简答题：什么是核技巧？以同心圆数据为例说明“把数据抬到高维再切一刀”的思路，并说明为什么核技巧不需要真的把数据映射到高维。
- 简答题：某同学用 RBF 核 SVM 预测客户流失，C 和 gamma 都用默认值，没有做标准化，测试准确率与“全部猜不流失”几乎一样。请分析可能的原因，并给出改进步骤。
- 实操题：在实验 6-2 的同心圆数据上，比较以下四个模型的测试准确率和支持向量数：线性核；3 次多项式核（`coef0=0`）；2 次多项式核（`coef0=1`）；RBF 核。都先标准化，其余参数用默认值。写出关键代码和结果，并解释 2 次多项式核加 `coef0=1` 为什么效果好。
- 实操题：在实验 6-1 的贷款审批数据上，用流水线（标准化 + RBF 核 SVM），C 取 0.1、1、10、100，gamma 取 0.01、0.1、1，在训练集上用 5 折交叉验证选出最好的组合，再报告它的测试准确率，并与第 5 章深度为 6 的决策树（测试准确率 0.827）比较。写出关键代码和结果。
- 实验报告：实验 6-1、实验 6-2、实验 6-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
