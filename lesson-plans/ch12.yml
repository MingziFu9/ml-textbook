chapter: 12
online: 4
offline: 3
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出时间序列的趋势、季节性、平稳性、自相关，强化学习的智能体、环境、状态、动作、奖励、策略的含义
  - 解释差分、指数平滑、滞后特征和滑动窗口的作用，时间序列为什么不能打乱做交叉验证，Q 学习为什么要在探索与利用之间平衡
  skill:
  - 手算移动平均、指数平滑、MAE、MAPE 和一步 Q 值更新，运用 statsmodels、LightGBM、PyTorch 预测销量，用 Gymnasium 实现 Q 学习
  - 比较不同预测方法的误差，分析特征重要性、促销日误差和学到的策略
  - 针对一个预测或决策任务，评价该选经典方法、机器学习还是深度学习，并检查模型在公平性、可解释性和数据合规方面的风险
  quality:
  - 实事求是地评价方法：用基准比较、以时间序列交叉验证为准，不因方法“新”就选它，如实记录 LSTM 不如经典方法的结果
  - 树立机器学习从业者的责任意识：主动检查模型的公平性与可解释性，遵守《个人信息保护法》《数据安全法》，最小必要、安全地使用数据
key_points:
- 时间序列的特点
- 经典预测方法
- 用机器学习做时序预测
- LSTM 时序预测与评价指标
- Q 学习
- 本领域的责任
difficulties:
- point: 把时间序列变成训练表格时，哪些特征在预测时已经知道；为什么不能打乱做交叉验证
  solution: 用 6 个数手算滑动窗口切表；在“滑动窗口与时序预测”动画中逐格滑动窗口；用“12 月 3 日预测 12 月 31 日时知不知道 12 月 30 日的销量”提问，引出滞后至少 28 天；对比实验 12-2 中时间序列交叉验证 170.9 与打乱 K 折 148.7
- point: Q 学习更新规则的含义，奖励怎样从终点传回起点
  solution: 先算“最短 6 步值 0.95⁵ = 0.774”，再按 α = 0.1、γ = 0.95 手算 Q(14,右) = 0.1、Q(13,右) = 0.0095 两步；用“Q 学习网格世界”动画一步步走，看公式代入数字和 Q 值一格格往回传，最后与实验 12-3 的 Q 表核对
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 12 章 时间序列预测与强化学习入门的情景导入和第一节，操作交互动画“滑动窗口与时序预测”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 4
    content: 情景导入：一家社区超市的店长每个月底都要做两件事：一是订下个月的货，二是排下个月的班。货订多了，牛奶、面包、蔬菜过期报废；订少了，……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 用超市订货排班和送货机器人引出时序预测与强化学习两条主线
  - name: 讲授
    minutes: 12
    content: 12.1 时间序列的特点：趋势、季节性与噪声、平稳性与差分、自相关
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 通过三年销量图、分解和自相关图认识趋势、季节性；手算差分，理解平稳性，对应数据处理工程师（高级）“时序模式”考点
  - name: 讲授
    minutes: 14
    content: 12.2 经典预测方法：朴素方法与移动平均、指数平滑、ARIMA 的直观理解、六种方法的比较
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 手算移动平均和指数平滑，理解 ARIMA 三个参数；用六种方法对比表说明“先做基准、抓住季节性”
  - name: 讲授与演示
    minutes: 14
    content: 12.3 用机器学习做时序预测：滞后特征与滑动窗口、用 LightGBM 预测、时间序列交叉验证
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“滑动窗口与时序预测”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 本章难点一：动画 + 手算掌握滞后特征和滑动窗口，明确特征必须在预测时已知；时间序列交叉验证，对应 Python 技术应用工程师（高级）“时序预测”考点
  - name: 讲授
    minutes: 8
    content: 12.4 LSTM 时序预测与评价指标：用 LSTM 预测、评价指标
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 比较四种方法，理解数据少时 LSTM 未必更好；手算 MAE、MAPE
  - name: 讲授
    minutes: 10
    content: 12.5 强化学习入门：智能体与环境、探索与利用、马尔可夫决策过程
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用冰湖对应强化学习六要素，用饭馆比喻理解探索与利用，算最短路线的折扣回报
  - name: 讲授与演示
    minutes: 18
    content: 12.6 Q 学习：Q 表与更新规则、Q 学习的完整过程、打滑的冰湖、深度强化学习与 RLHF
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“Q 学习网格世界”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 本章难点二：手算 Q 值更新，动画演示 Q 值往回传；分析打滑冰湖“先保安全”的策略；了解深度强化学习与 RLHF
  - name: 讲授
    minutes: 10
    content: 12.7 本领域的责任：算法公平性、可解释性、数据合规
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用分组批准率例子学会检查公平性，对照法规清单自查数据合规
  - name: 实验
    minutes: 15
    content: 实验 12-1 门店销量预测（经典方法）
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成数据探索和六种方法对比，读懂自相关图
  - name: 实验
    minutes: 20
    content: 实验 12-2 机器学习与 LSTM 时序预测对比
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成特征构造、时间序列交叉验证和 LightGBM 预测，LSTM 部分课后完成
  - name: 课堂练习
    minutes: 6
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 4
    content: 用本章知识导图回顾要点，并沿项目流程回顾全课程
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 12.8 前沿视窗；选做实验 12-3 Q 学习走冰湖，在动画中核对起点 Q 值 0.774
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是时间序列的平稳性？为什么很多方法要先做差分？分别说明一阶差分和季节差分（周期 7）能去掉什么。
- 简答题：以超市每日销量为例，说明怎样把一条时间序列转换成 LightGBM 能用的训练表格。如果要一次预测未来 28 天，构造滞后特征时要注意什么？
- 简答题：写出 Q 学习的更新规则，说明其中“目标值”的含义，以及学习率 α、折扣因子 γ、探索率 ε 各起什么作用。
- 实操题：在实验 12-2 中，分别去掉“是否促销”特征、去掉全部 6 个滞后和滑动窗口特征，其余设置不变，重新做时间序列交叉验证并预测最后 28 天，记录交叉验证 MAE、测试 MAE 和两个促销日的误差，与使用全部特征时比较，并解释结果。
- 实操题：在实验 12-3 中，把折扣因子 γ 分别设为 0.5、0.95、0.99，在不打滑的冰湖上各训练 2000 回合，记录起点的最大 Q 值；再把 γ 分别设为 0.5、0.9、0.99，在打滑的冰湖上各训练 20 000 回合（α = 0.05），测试学到的策略的成功率。比较并解释。
- 实验报告：实验 12-1、实验 12-2、实验 12-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
