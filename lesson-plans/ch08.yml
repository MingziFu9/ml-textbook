# 第 8 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 8
online: 4
offline: 4
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出聚类、K 均值、簇中心、轮廓系数、DBSCAN、噪声点、降维、主成分分析、方差解释率、孤立森林的含义
  - 解释 K 均值为什么切不开月牙形的数据，DBSCAN 的 eps 和 min_samples 怎样影响结果，PCA 为什么要找“方差最大的方向”，t-SNE 为什么只用来看图
  skill:
  - 运用 scikit-learn 完成 K 均值、层次聚类、DBSCAN、PCA、t-SNE 和孤立森林；手算 K 均值的迭代和一个点的轮廓系数
  - 用肘部法则、轮廓系数和业务需要分析该分几群，用方差解释率分析该保留几个主成分
  - 根据 RFM 分群结果撰写一份客户分群和运营建议报告
  quality:
  - 树立以客户为中心、精细化运营的意识，用数据代替“一刀切”，同时不对客户贴歧视性标签
  - 理解算法结果需要人来解读和复核：簇要人起名，可疑交易要人工核实，不凭模型输出直接处置客户
key_points:
- 聚类与 K 均值
- 层次聚类与 DBSCAN
- 降维与主成分分析
- 异常检测
difficulties:
- point: K 均值的迭代过程和局限，学生容易把“簇内平方和最小”当作选 K 的标准
  solution: 先手算 6 个点迭代两轮，再用“K-Means 迭代”动画一步步验证，换月牙形数据观察局限；用实验 8-1 的曲线说明簇内平方和随 K 一直下降，选 K 要看肘部、轮廓系数和业务需要
- point: PCA“方差最大的方向”和方差解释率的含义比较抽象
  solution: 用“PCA 投影方向”动画转动直线，让学生自己找到保留 98.5% 的方向，再说明它就是第一主成分；结合手写数字前 2 个主成分只有 28.5%、20 个主成分准确率不变讲方差解释率
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 8 章 聚类、降维与异常检测的情景导入和第一节，操作交互动画“K-Means 迭代”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: '情景导入：一家网上商城的运营部门手里有 2000 位老客户一年的订单记录，部门经理提了三个问题。


      第一，“每个月给所有客户发一样……'
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 用网上商城的三个问题引出聚类、降维、异常检测
  - name: 讲授与演示
    minutes: 25
    content: 8.1 聚类与 K 均值：物以类聚、K 均值算法、算一算、K 值的选择等
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“K-Means 迭代”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 手算 + 动画掌握 K 均值和选 K 方法，对应数据处理工程师（高级）“聚类”考点
  - name: 讲授与演示
    minutes: 20
    content: 8.2 层次聚类与 DBSCAN：层次聚类与树状图、DBSCAN、三种算法怎么选
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“DBSCAN 密度聚类”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 动画对比 eps 的影响，理解三种算法各适合什么样的数据
  - name: 讲授与演示
    minutes: 20
    content: 8.3 降维与主成分分析：为什么要降维、PCA、方差解释率、t-SNE
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“PCA 投影方向”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 动画突破 PCA 难点，明确 t-SNE 只用于看图
  - name: 讲授
    minutes: 15
    content: 8.4 异常检测：基于统计的方法、基于聚类的方法、孤立森林
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 对比 3σ 法则和孤立森林的效果，理解无监督异常检测的价值和局限
  - name: 实验
    minutes: 40
    content: 实验 8-1 电商客户分群（RFM 模型）
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 完成 RFM 客户分群，小组讨论各群命名和运营建议，对应训练师（三级）“业务分析”考点
  - name: 实验
    minutes: 40
    content: 实验 8-2 三种聚类算法对比与异常检测
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成三种聚类对比和孤立森林两部分
  - name: 课堂练习
    minutes: 8
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 7
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 8.5 前沿视窗；撰写客户分群分析与运营建议报告；选做实验 8-3 PCA 与 t-SNE 降维可视化
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：说明 K 均值算法的步骤，并说明它的主要局限，以及在什么情况下应该改用 DBSCAN。
- 简答题：某网店用 RFM 模型和 K 均值把客户分成三群，各群 R、F、M 的中位数如下表。请给每一群起一个名字，并分别提出一条运营建议。
- 简答题：比较 PCA 和 t-SNE：各自的目标是什么？为什么说 t-SNE “只用来看图”？实验 8-3 中，PCA 降到二维时各数字重叠严重，降到 20 维后 SVM 准确率却和不降维一样，这说明了什么？
- 实操题：在实验 8-1 的基础上，比较两种预处理：① 先 `np.log1p` 再标准化（实验中的做法）；② 直接标准化。分别取 K = 3、4、5，计算轮廓系数，并列出 K = 4 时各群的人数和 R、F、M 中位数。轮廓系数高的就一定更好吗？写出关键代码、结果和分析。
- 实操题：在实验 8-2 的基础上，把孤立森林的 `contamination` 分别设为 0.005、0.01、0.02、0.05，列出每种设置标出的可疑交易数、其中真欺诈数、命中率和找到的欺诈占全部欺诈的比例。如果风控部门每天只有人力复核 200 笔，应该怎样设置？写出关键代码、结果和分析。
- 实验报告：实验 8-1、实验 8-2、实验 8-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
