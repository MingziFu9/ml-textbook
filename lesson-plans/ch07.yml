# 第 7 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 7
online: 4
offline: 3
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 K 近邻、欧氏距离、贝叶斯定理、朴素贝叶斯、拉普拉斯平滑、支持度、置信度、提升度的含义
  - 解释 K 近邻为什么必须标准化、K 值怎样影响结果，朴素贝叶斯为什么“朴素”，提升度为什么比置信度更能说明规则的价值
  skill:
  - 运用 scikit-learn 训练 K 近邻和朴素贝叶斯分类器，用 mlxtend 挖掘频繁项集和关联规则；手算贝叶斯定理和关联规则的三个指标
  - 分析被误判的短信和“看上去很准却没有意义”的关联规则
  - 根据关联规则撰写一份给门店经理的摆货和促销建议
  quality:
  - 理解“相关不等于因果”，对数据中发现的规律保持审慎，用试点验证后再推广
  - 认识到垃圾短信、电信诈骗的常见特征，增强防范意识；分析用户数据时遵守个人信息保护规定
key_points:
- K 近邻
- 贝叶斯定理
- 朴素贝叶斯
- 关联规则
difficulties:
- point: 贝叶斯定理的计算，学生凭直觉认为检测阳性就很可能患病
  solution: 先让学生凭直觉猜，再用 10000 人的表格逐行算出 95 / 590 ≈ 16.1%，最后才给公式；联系第 4 章类别不平衡时“判为正类的大多是误报”
- point: 支持度、置信度、提升度的区别，为什么置信度高的规则不一定有价值
  solution: 用 10 张小票手算三条规则，再用“关联规则计算器”动画对比面包 → 牛奶与牛奶 → 面包、啤酒 → 面包；结合实验 7-3 中苹果 → 鸡蛋提升度只有 1.10 的例子讲提升度
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 7 章 K 近邻、朴素贝叶斯与关联规则的情景导入和第一节，操作交互动画“KNN 决策区域”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: '情景导入：一家连锁超市的数字化部门同时找来了三件事。


      第一件，会员中心想给新注册的会员推荐合适的酒：“新会员只填了几项口味偏好，……'
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 用超市的三个真实需求引出本章三种方法
  - name: 讲授与演示
    minutes: 15
    content: 7.1 K 近邻：近朱者赤、距离度量、K 值的选择、为什么一定要标准化等
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“KNN 决策区域”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 动画直观呈现 K 值和标准化的作用，维度灾难为第 8 章降维做铺垫
  - name: 讲授
    minutes: 10
    content: 7.2 贝叶斯定理：条件概率、贝叶斯定理
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用检测阳性的例子突破贝叶斯定理难点，纠正“P(A|B) = P(B|A)”的直觉错误
  - name: 讲授
    minutes: 15
    content: 7.3 朴素贝叶斯：用贝叶斯定理做分类、算一算、拉普拉斯平滑、三种朴素贝叶斯
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 手算一条短信的分类过程，理解条件独立假设和拉普拉斯平滑，对应人工智能应用工程师“机器学习”考点
  - name: 讲授与演示
    minutes: 20
    content: 7.4 关联规则：购物篮问题、支持度、置信度与提升度、Apriori 算法、FP-Growth 算法等
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“关联规则计算器”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 手算 + 动画掌握三个指标和 Apriori 剪枝，对应数据处理工程师（高级）“关联规则、智能推荐”考点
  - name: 实验
    minutes: 25
    content: 实验 7-1 KNN 葡萄酒分类与 K 值选择
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成①～④步，第⑤步维度灾难课后完成
  - name: 实验
    minutes: 30
    content: 实验 7-2 朴素贝叶斯垃圾短信过滤
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 在真实短信数据上完成训练、评估和误判分析
  - name: 课堂练习
    minutes: 8
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 7
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 7.5 前沿视窗；完成实验 7-3 超市购物篮分析，撰写给门店经理的摆货和促销建议
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“近朱者赤，近墨者黑”说明 K 近邻的分类过程，并说明为什么使用 KNN 前必须对特征做标准化、K 值过大和过小各有什么问题。
- 简答题：训练集有垃圾短信 2 条（共 10 个词）、正常短信 3 条（共 15 个词），词表大小为 5。“优惠”在垃圾短信中出现 3 次、正常短信中 1 次；“明天”在垃圾短信中出现 0 次、正常短信中出现 2 次。用拉普拉斯平滑的多项式朴素贝叶斯判断短信“优惠 明天”属于哪一类，写出计算过程。
- 简答题：某门店分析小票后得到规则 {矿泉水} → {纸巾}，置信度 0.35，并据此建议把纸巾和矿泉水放在一起。已知纸巾本身出现在 34% 的小票中。请评价这个建议，并说明评价一条关联规则应看哪些指标。
- 实操题：在实验 7-1 的基础上，比较 K = 12 时 `weights="uniform"`（等权投票）和 `weights="distance"`（距离越近权重越大）两种方式的 5 折交叉验证准确率和测试准确率；再只用 proline、flavanoids 两个特征（都先标准化），K 取 1、5、15，计算测试准确率。写出关键代码和结果。
- 实操题：在实验 7-3 的基础上，把最小支持度降到 0.01，生成置信度不低于 0.3 的单商品规则，列出提升度最高的 5 条和新增的规则数；再找出所有提升度小于 0.8 的单商品规则（最小置信度设为 0），写出关键代码和结果，并据此给门店经理提一条建议。
- 实验报告：实验 7-1、实验 7-2、实验 7-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
