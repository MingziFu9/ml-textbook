# 第 11 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 11
online: 4
offline: 4
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出卷积、卷积核、特征图、步长与填充、池化、循环神经网络、隐藏状态、LSTM、门控机制、迁移学习的含义
  - 解释卷积层为什么比全连接层更适合处理图片，循环神经网络为什么能处理序列，LSTM 怎样缓解长期依赖问题
  skill:
  - 手算卷积和池化的结果与特征图尺寸，运用 PyTorch 和 Keras 搭建卷积神经网络分类图片、搭建 LSTM 分类文本
  - 根据训练曲线、混淆矩阵和认错的样本分析模型的问题
  - 针对图片、文本等任务，评价该选卷积网络、循环网络还是经典方法，是否需要数据增强或迁移学习
  quality:
  - 体会“看错在哪里”的工匠精神：先分析认错的样本和数据本身的局限，再决定改模型还是改数据
  - 理性选择技术：复杂模型不一定更好，按任务特点、成本和效果选择 CNN、RNN 或经典方法；了解飞桨、昇思等国产工具
key_points:
- 图像在计算机中的样子
- 卷积与池化
- 卷积神经网络的结构
- 数据增强与迁移学习
difficulties:
- point: 卷积的计算过程，特征图尺寸和卷积层参数个数的计算
  solution: 先在黑板上手算 5×5 小图配竖边核的三个位置，再用“卷积计算器”动画逐格核对并切换步长、填充；参数个数用“全连接 100 480 对卷积 160”的对比表，强调乘输入通道数、加偏置
- point: RNN 的隐藏状态与长期依赖，LSTM 的门为什么能记得更久
  solution: 用 1 维“垃圾嫌疑”的例子手算 RNN 的 h 一路缩小到 0.052，再算 LSTM 的 c 保持在 0.71；用“RNN 与 LSTM 逐步展开”动画对比两者对开头词的梯度（2.4 × 10⁻⁵ 对 0.317），再把遗忘门调小观察
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 11 章 卷积神经网络与循环神经网络的情景导入和第一节，操作交互动画“卷积计算器”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：一家服装电商每天上新几千件商品，运营人员要给每张商品图打上类别标签：T 恤、衬衫、外套、连衣裙……人工打标签又慢又容易出……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 用商品图分类和垃圾留言识别引出 CNN 与 RNN 两条主线
  - name: 讲授
    minutes: 8
    content: 11.1 图像在计算机中的样子
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 建立“图片就是数字表格”的认识，理解张量形状
  - name: 讲授与演示
    minutes: 22
    content: 11.2 卷积与池化：卷积、步长、填充与特征图、池化、为什么卷积比全连接更适合图片
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“卷积计算器”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 本章难点一：手算 + 动画掌握卷积、步长、填充、池化和参数计算，对应数据处理工程师（高级）“深度学习实战”考点
  - name: 讲授
    minutes: 15
    content: 11.3 卷积神经网络的结构：卷积层、池化层、全连接层、从 LeNet 到 ResNet
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 结合实验 11-2 结果比较 CNN 与 MLP，通过认错的图片学会分析问题；了解 CNN 发展史
  - name: 讲授
    minutes: 10
    content: 11.4 数据增强与迁移学习：数据增强、迁移学习与预训练模型
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用翻转增强反而变差的实测结果说明增强要符合实际，理解迁移学习思想
  - name: 讲授
    minutes: 15
    content: 11.5 循环神经网络：序列数据、隐藏状态与时间步、长期依赖与梯度问题
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 手算 RNN 读短信，理解隐藏状态、参数共享和长期依赖
  - name: 讲授与演示
    minutes: 20
    content: 11.6 LSTM 与 GRU：LSTM 的门、GRU、词嵌入
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“RNN 与 LSTM 逐步展开”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 本章难点二：动画对比 RNN 与 LSTM，理解门控机制；比较 LSTM 与朴素贝叶斯，学会按任务选模型
  - name: 实验
    minutes: 25
    content: 实验 11-1 手算卷积与池化
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成小图验证和四个卷积核处理照片
  - name: 实验
    minutes: 45
    content: 实验 11-2 CNN 服装图片分类
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成 PyTorch 版 CNN 与 MLP 的对比和错误分析，Keras 版课后完成
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 11.7 前沿视窗；选做实验 11-3，比较 LSTM 与朴素贝叶斯
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“竖边”卷积核 [[−1, 0, 1], [−1, 0, 1], [−1, 0, 1]] 处理一张左边暗、右边亮的图，说明特征图中哪些位置的值大、哪些位置为 0，并说明卷积神经网络中卷积核与传统图像处理中卷积核的区别。
- 简答题：画出（或写出）一个用于 28 × 28 灰度图、10 分类的卷积神经网络的结构，写出每一层输出的形状，并说明为什么越往后特征图越小、通道越多。
- 简答题：什么是长期依赖问题？简单 RNN 为什么难以处理长期依赖？LSTM 是怎样缓解这个问题的？
- 实操题：在实验 11-2 的 PyTorch 卷积网络训练时加入数据增强：每一批中随机一半的图片左右翻转（`torch.flip(x, dims=[3])`），其余设置不变，训练 10 轮，记录训练、验证、测试准确率，与不增强时比较，并解释原因。
- 实操题：把实验 11-3 中的 `nn.LSTM` 换成 `nn.GRU`，其余设置不变，记录参数个数、每轮验证准确率和测试集上的准确率、召回率、训练用时，与 LSTM 比较。
- 实验报告：实验 11-1、实验 11-2、实验 11-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
