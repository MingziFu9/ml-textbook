# 第 9 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 9
online: 4
offline: 4
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出偏差与方差、交叉验证、学习曲线、验证曲线、网格搜索、流水线、SHAP 值、数据漂移的含义
  - 解释为什么一次划分的成绩不可靠，为什么预处理要放进流水线，为什么最终模型要按验证集而不是测试集挑选
  skill:
  - 运用 scikit-learn 完成交叉验证、学习曲线、网格搜索和流水线，用 Optuna 自动调参，用 joblib、FastAPI、Gradio 保存和发布模型
  - 根据学习曲线分析模型是欠拟合还是过拟合，并提出改进办法；用置换重要性和 SHAP 值分析模型为什么这样预测
  - 判断调参带来的提升是否值得，评价一个模型能否上线、上线后要监控什么
  quality:
  - 树立实事求是的科学态度：如实报告测试成绩，不靠反复“挑”测试集让结果好看
  - 增强责任意识：模型上线后持续监控，向业务人员讲清模型的依据和局限，不把相关当因果
key_points:
- 偏差、方差与学习曲线
- 交叉验证
- 超参数调优
- 流水线：防止数据泄露
difficulties:
- point: 从学习曲线判断偏差大还是方差大，并给出对应的改进措施
  solution: 用射手比喻建立直观认识，再对照实验 9-1 的四条学习曲线逐一诊断：线性回归两线贴近且低、不限深度决策树差距 0.29；最后用验证曲线展示从欠拟合到过拟合的全过程
- point: 数据泄露为什么会让成绩虚高，学生往往觉得“先标准化再划分”无所谓
  solution: 先让学生猜随机标签的数据能有多高的准确率，再演示实验 9-2 中先选特征的 0.740 与流水线的 0.415；用流程图对比错误流程和正确流程，最后落到 Pipeline 写法
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 9 章 模型选择、调优与部署的情景导入和第一节，操作交互动画“K 折交叉验证”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：前面八章，我们给客户流失预测做了好几个模型：第 4 章的逻辑回归测试 AUC 0.836，第 5 章的随机森林 0.81……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 用业务部门的四个问题引出本章主线
  - name: 讲授
    minutes: 15
    content: 9.1 偏差、方差与学习曲线：偏差与方差、学习曲线、验证曲线
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 结合学习曲线、验证曲线理解偏差与方差，对应训练师（三级）“智能训练”考点
  - name: 讲授与演示
    minutes: 15
    content: 9.2 交叉验证：为什么一次划分不够、K 折与分层 K 折、时间序列交叉验证、训练集、验证集、测试集各管什么
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“K 折交叉验证”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 用 K 折交叉验证动画对比三种划分方法，明确测试集只用一次
  - name: 讲授
    minutes: 12
    content: 9.3 超参数调优：参数与超参数、网格搜索与随机搜索、Optuna 自动调参、调参的收益有多大
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 比较三种调参方法，用实验结果说明调参收益有限、要先做好基线
  - name: 讲授
    minutes: 13
    content: 9.4 流水线：防止数据泄露：数据泄露、Pipeline 与 ColumnTransformer
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 随机数据演示突破数据泄露难点，掌握流水线写法
  - name: 讲授
    minutes: 12
    content: 9.5 模型解释：特征重要性与置换重要性、SHAP 值
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用 SHAP 解释单个客户的预测，练习用业务语言讲清模型依据
  - name: 讲授
    minutes: 15
    content: 9.6 模型保存与部署：用 joblib 保存模型、用 FastAPI 做预测接口、用 Gradio 做网页小工具、上线以后
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 演示 FastAPI 接口和 Gradio 小工具，理解上线后监控，对应训练师（三级）“智能系统设计”考点
  - name: 实验
    minutes: 30
    content: 实验 9-1 交叉验证与学习曲线
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成交叉验证、学习曲线和验证曲线三步
  - name: 实验
    minutes: 50
    content: 实验 9-2 一条完整的建模流水线
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成流水线、调参和 SHAP 解释，保存模型供实验 9-3 使用
  - name: 课堂练习
    minutes: 8
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 9.7 前沿视窗；选做实验 9-3，把模型发布成接口和网页小工具，撰写上线监控方案
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是偏差和方差？怎样从学习曲线判断一个模型是偏差大还是方差大？对两种情况各提出两条改进措施。
- 简答题：某同学的做法是：读入数据 → 对全部数据填充缺失值、独热编码、标准化 → 划分训练集和测试集 → 在训练集上网格搜索 → 在测试集上评价。请指出其中的问题，并写出改进后的流程。
- 简答题：你训练了一个流失预测模型，准备交给客服部门使用。请说明可以采用哪些方式提供给客服部门，并说明上线后需要做哪些工作来保证模型持续有效。
- 实操题：在实验 9-2 的基础上，用 `validation_curve` 画出逻辑回归流水线中参数 C（`model__C`）取 0.0001、0.001、0.01、0.1、1、10、100 时的训练 AUC 和验证 AUC（5 折分层交叉验证），判断 C 取多少合适，并说明 C 太小时模型处于什么状态。写出关键代码和结果。
- 实操题：在 `app_fastapi.py` 的基础上增加一个批量预测接口 `/predict_batch`：一次接收 1～1000 位客户的列表，返回每位客户的序号和流失概率；空列表要返回 422 错误而不是让服务器出错。用测试客户端发送测试集的前 5 位客户，并发送一个空列表，写出代码和结果。
- 实验报告：实验 9-1、实验 9-2、实验 9-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
