# 第 10 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 10
online: 4
offline: 3
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出神经元、感知机、多层感知机、激活函数、前向传播、反向传播、梯度消失、优化器、Dropout、批归一化的含义
  - 解释感知机为什么学不会异或、多加一个隐藏层为什么就能学会，反向传播怎样把误差一层层往回传
  skill:
  - 运用 NumPy 从零实现一个两层网络，用 PyTorch 和 Keras 3 搭建、训练多层感知机
  - 根据损失曲线和验证成绩分析学习率、优化器、Dropout、早停、批归一化对训练的影响
  - 针对一个具体任务，评价该用经典机器学习模型还是神经网络
  quality:
  - 了解神经网络从感知机受挫到深度学习复兴的近半个世纪历程，体会科学研究中坚持与创新的精神
  - 实事求是看待新技术：实验中神经网络不如 SVM、正则化效果有限时如实记录，按数据选模型、不追名气
key_points:
- 从逻辑回归到神经元
- 多层感知机
- 神经网络怎样学习
- 训练技巧
difficulties:
- point: 为什么多加一个隐藏层就能学会异或，隐藏层到底在做什么
  solution: 先让学生在平面上画四个点、尝试用一条直线分开；再用“神经网络训练场”动画训练 100 轮、1000 轮，看分界线弯过来；最后看实验 10-1 隐藏层输出表和“加权和”柱状图，说明隐藏层把点搬到了新空间
- point: 反向传播与链式法则，学生容易被公式吓住
  solution: 只讲一个 x = 2、两个权重的最小网络，带学生一步步手算 dL/dw₂ = 2、dL/dh = 6、dL/dw₁ = 12，强调“误差乘上权重往回传”；再展示 PyTorch 自动求导得到同样的 12
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 10 章 神经网络基础的情景导入和第一节，操作交互动画“神经元与激活函数”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：一家银行的信贷科每天要审几百份小额贷款申请。老科长的经验是：“有稳定工作加分，有房子加分，信用记录好加分，三样里占两样以……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 用老科长审贷款的经验引出人工神经元，设下“学不会的简单问题”悬念
  - name: 讲授与演示
    minutes: 12
    content: 10.1 从逻辑回归到神经元：人工神经元、感知机及其局限
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“神经元与激活函数”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 手算一个神经元，用动画让感知机学与、或、异或，发现局限
  - name: 讲授与演示
    minutes: 15
    content: 10.2 多层感知机：输入层、隐藏层、输出层、激活函数、为什么多一层就能学会异或
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“神经网络训练场”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 本章难点一，动画 + 隐藏层输出表突破“多一层就能学会异或”
  - name: 讲授
    minutes: 15
    content: 10.3 神经网络怎样学习：前向传播与损失、反向传播、梯度消失
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 本章难点二，手算最小网络的反向传播；用实验 10-3 数据说明梯度消失，对应数据处理工程师（高级）“深度学习实战”考点
  - name: 讲授
    minutes: 15
    content: 10.4 训练技巧：优化器、轮次、批大小与学习率、防止过拟合、批归一化
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用实验 10-3 的对比表归纳优化器、学习率、Dropout、早停、批归一化的作用
  - name: 讲授
    minutes: 10
    content: 10.5 深度学习框架入门：PyTorch、Keras 3、两种框架对照
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 对照 PyTorch 与 Keras 的代码，记住训练循环四步，对应人工智能应用工程师“神经网络与深度学习”考点
  - name: 实验
    minutes: 25
    content: 实验 10-1 用 NumPy 从零实现神经网络
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成感知机和两层网络，梯度检查和画图课后完成
  - name: 实验
    minutes: 25
    content: 实验 10-2 PyTorch 与 Keras 识别手写数字
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 课上完成 PyTorch 与 Keras 两份代码并比较结果
  - name: 课堂练习
    minutes: 8
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 10.6 前沿视窗；选做实验 10-3，写一份调参记录
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是异或问题？为什么单层感知机解决不了它，而加一个隐藏层就能解决？
- 简答题：用自己的话说明神经网络训练一步的过程（前向传播、损失、反向传播、更新参数），并说明为什么反向传播要从输出层往回算。
- 简答题：某同学用 300 张图片训练一个三层、每层 512 个神经元的网络，训练准确率 100%，验证准确率只有 70%，而且验证损失从第 20 轮开始不断上升。请诊断问题，并按优先顺序提出至少四条改进建议。
- 实操题：修改实验 10-1 的两层网络，把隐藏神经元个数分别改为 1、2、8 个（其余设置不变：随机种子 0 初始化、Sigmoid、学习率 1.0、训练 5000 轮），记录最终损失、四个点的输出和判对个数，并解释结果。
- 实操题：在实验 10-2 的 Keras 网络中，在隐藏层后加一层 `Dropout(0.2)`，并使用早停（监控验证损失，耐心 10 轮，取回最好的参数），把 `epochs` 设为 200，其余不变。记录实际训练了多少轮、最好的是第几轮、测试准确率，并与实验 10-2 的结果比较。
- 实验报告：实验 10-1、实验 10-2、实验 10-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
