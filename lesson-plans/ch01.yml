# 第 1 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 1
online: 3
offline: 3
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出机器学习的含义，以及样本、特征、标签、模型、训练、预测、泛化等基本术语
  - 解释“写规则”和“从数据中学习”两种做法的区别，以及训练集和测试集为什么必须分开
  skill:
  - 区分监督学习（回归、分类）、无监督学习和强化学习，能判断一个业务问题属于哪一类
  - 描述机器学习项目从问题定义、数据准备、特征工程、建模、评估到部署监控的流程，并能把一个业务需求改写成机器学习问题
  - 搭建本书的实验环境，用 scikit-learn 的 fit、predict、score 完成第一个分类模型
  quality:
  - 认识到机器学习的结论来自数据，养成用测试集如实评估、不“偷看”答案的科学态度
  - 了解国产机器学习平台和开源大模型的发展，增强科技自信
key_points:
- 机器学习的含义，样本、特征、标签、训练集与测试集等基本术语
- 判断业务问题属于回归、分类、聚类等哪类任务
- 机器学习项目的六个步骤，把业务需求翻译成机器学习问题
- scikit-learn 的 fit、predict、score
difficulties:
- point: 区分回归和分类、监督和无监督：学生容易按“特征是数值还是文字”来判断任务类型
  solution: 强调“只看要预测的东西”；用“三种学习范式分一分”动画让学生判断 12 个场景，集中讲评门店销量、会员分群两道易错题
- point: 训练集和测试集为什么必须分开，什么是泛化能力
  solution: 用“拿练习原题考试”的类比，结合实验 1-2 换随机种子准确率变化、实验 1-3 规则在新申请上下降的结果说明
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 54
    content: 阅读网页教材第 1 章 机器学习概述与项目流程的情景导入和第一节，操作交互动画“三种学习范式分一分”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 8
    content: 情景导入：阿芳在一家连锁通信营业厅做店长。公司每个月都有几千名手机用户销号转网，总部给每家门店下了任务：提前找出“可能要走”的客户……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 7
    content: 1.1 什么是机器学习：写规则与从数据中学习、身边的机器学习、人工智能、机器学习与深度学习
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 从垃圾短信、贷款审批两个例子对比写规则与学规则，建立机器学习的基本印象
  - name: 讲授
    minutes: 10
    content: 1.2 机器学习的基本术语：样本、特征与标签、模型、训练与预测、训练集、测试集与泛化能力
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用鸢尾花表格把样本、特征、标签对应到具体的行和列，用“老中介估价”类比训练和预测
  - name: 讲授与演示
    minutes: 12
    content: 1.3 三种学习范式：监督学习、无监督学习、强化学习、半监督学习与自监督学习
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“三种学习范式分一分”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 动画即时反馈帮助学生掌握判断学习范式的方法，对应人工智能应用工程师“机器学习”考点
  - name: 讲授
    minutes: 12
    content: 1.4 机器学习项目流程：从业务问题到机器学习问题、六个步骤、一个例子
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 把业务需求翻译成机器学习问题，对应训练师三级“业务分析”考点；流失预警表是全书地图
  - name: 讲授
    minutes: 5
    content: 1.6 本书使用的工具：Python 机器学习工具箱、scikit-learn 的 fit、predict、score
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 统一 scikit-learn 的 fit、predict、score 用法，为实验做准备
  - name: 实验
    minutes: 20
    content: 实验 1-1 搭建机器学习实验环境（课前已按教材安装，课上运行自检脚本、集中排错）
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 检查课前环境安装情况，集中解决安装问题，保证后续实验顺利进行
  - name: 实验
    minutes: 45
    content: 实验 1-2 第一个机器学习模型：鸢尾花分类
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 用 pandas 查看一份数据集，指出其中的样本、特征和标签；用 `train_test_split` 划分训练集和测试
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 6
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 81
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 1.5 机器学习简史和 1.7 前沿视窗；选做实验 1-3 写规则 vs 学规则
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是机器学习？结合垃圾短信识别的例子，说明它与传统“写规则”的方法有什么不同。
- 简答题：简述机器学习项目的六个步骤，并说明为什么说这个流程是“迭代”的。
- 简答题：某外卖平台的运营经理说：“最近很多用户抱怨送餐慢，你们用 AI 想想办法。”请按 1.4.1 节的五个问题，把它改写成一个机器学习问题。
- 实操题：修改实验 1-2，把 `random_state` 依次取 0 到 9，每次重新划分数据、训练 K 近邻模型，输出 10 次的测试集准确率及其平均值。写出关键代码和运行结果，并说明只用一次划分评估模型有什么问题。
- 实操题：在实验 1-3 的基础上，写出你自己的第三版审批规则（不超过 6 条 if），分别计算它在“历史记录”和“新申请”上的准确率，与决策树比较，并写出你的规则和运行结果。
- 实验报告：实验 1-1、实验 1-2、实验 1-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
