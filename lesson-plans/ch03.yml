# 第 3 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 3
online: 4
offline: 3
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出线性回归、损失函数、均方误差、梯度、学习率、过拟合和正则化的含义
  - 解释最小二乘法和梯度下降的思路，学习率过大、过小分别会怎样，批量、随机、小批量三种梯度下降的区别
  skill:
  - 运用 NumPy 实现一元线性回归的梯度下降，用 scikit-learn 训练多元线性回归、岭回归和 Lasso，计算 MAE、RMSE、R²
  - 分析回归系数的含义和残差图的形状，根据训练误差和测试误差判断欠拟合和过拟合
  - 评价一个回归模型够不够用，并能提出改进方向
  quality:
  - 体会“模型 → 损失 → 优化”的科学建模思路，理解大模型训练与本章方法一脉相承
  - 养成看残差图、做基线对比、如实报告误差的习惯，不只报一个好看的数字
key_points:
- 最小二乘法与均方误差
- 梯度下降与学习率
- 回归评价指标 MAE、RMSE、R² 与残差图
- 过拟合与岭回归、Lasso 正则化
difficulties:
- point: 梯度和梯度下降的含义，学习率过大、过小的后果
  solution: 用“蒙眼下山”比喻，板书 5 套房子标准化后的第一步更新；用“梯度下降下山”动画对比 0.01、0.5、0.9、1.05 四种学习率和不标准化的峡谷地形
- point: 过拟合与正则化：为什么训练误差越小，测试误差反而越大
  solution: 用“多项式阶数与过拟合”动画拖动阶数观察 15 阶曲线扭动，再固定 15 阶调大 alpha；结合实验 3-3 的系数之和从 165 万降到 71.3 说明正则化的作用
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 3 章 线性回归与梯度下降的情景导入和第一节，操作交互动画“梯度下降下山”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 6
    content: 情景导入：上一章，小周把 3000 套二手房的挂牌数据整理干净了。经理问他：“现在能做估价了吗？用户输入面积、区域、楼层，系统要马……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 4
    content: 3.1 回归问题
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 联系房价、销量等工作场景认识回归问题
  - name: 讲授
    minutes: 12
    content: 3.2 一元线性回归：用一条直线拟合数据、损失函数与均方误差、算一算
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 手算 5 个点的最小二乘，让学生理解“找最好的直线”有明确的计算标准
  - name: 讲授与演示
    minutes: 15
    content: 3.3 梯度下降：蒙眼下山、学习率、批量、随机与小批量梯度下降、梯度下降前先做特征缩放
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“梯度下降下山”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 本章重点，比喻 + 手算一步 + 动画三管齐下突破梯度下降难点
  - name: 讲授
    minutes: 13
    content: 3.4 多元线性回归与回归评价：多元线性回归与系数解读、多重共线性、回归评价指标、残差图等
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 结合二手房结果解读系数和指标，用残差图引出改进思路，对应数据处理工程师“回归”考点
  - name: 讲授与演示
    minutes: 12
    content: 3.5 过拟合与正则化：多项式回归、欠拟合与过拟合、正则化
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“多项式阶数与过拟合”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 动画直观呈现欠拟合与过拟合，对应人工智能应用工程师“统计模型”考点
  - name: 实验
    minutes: 25
    content: 实验 3-1 手算与 NumPy 实现梯度下降
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 从零实现梯度下降，体会学习率和特征缩放的作用（课上完成①②部分，③部分课后完成）
  - name: 实验
    minutes: 35
    content: 实验 3-2 二手房价格预测
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 在真实业务数据上完成建模、评估和残差分析的完整流程
  - name: 课堂练习
    minutes: 8
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 3.6 前沿视窗；完成实验 3-1 第③部分；选做实验 3-3
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“蒙眼下山”的比喻说明梯度下降的过程，并说明学习率过大和过小分别会出现什么现象。
- 简答题：比较 MAE、RMSE 和 R² 三个回归指标，说明为什么在报告中通常要同时给出 R² 和 MAE（或 RMSE）。
- 简答题：某同学用 20 天的数据训练销量预测模型，训练 MSE 很小，测试 MSE 却很大。请判断这是什么问题，分析原因，并给出至少三种解决办法。
- 实操题：修改实验 3-2，分别用三组特征训练线性回归：①只用面积；②面积和区域（独热编码）；③全部 25 个特征。输出每组的特征个数和测试集 MAE、RMSE、R²，写出关键代码和结果，并分析哪一类特征对估价最重要。
- 实操题：在实验 3-2 的 25 个特征上，先用 `StandardScaler` 标准化，再分别训练普通线性回归、岭回归（alpha = 1、10、100）和 Lasso（alpha = 1、5、20），输出测试集 R²、RMSE 和 Lasso 中系数为 0 的特征。写出关键代码和结果，并说明在这份数据上正则化有没有帮助，为什么。
- 实验报告：实验 3-1、实验 3-2、实验 3-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
