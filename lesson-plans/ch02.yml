# 第 2 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 2
online: 4
offline: 4
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出常见的数据质量问题，以及缺失值填充、异常值检测、独热编码、标准化、归一化的含义
  - 解释为什么要先划分数据集再做预处理，什么是数据泄露，哪些算法需要特征缩放
  skill:
  - 运用 pandas 和 scikit-learn 完成描述统计、数据透视、缺失与异常处理、编码和缩放
  - 分析一份数据的质量问题，用相关系数、特征重要性等方法比较特征，构造和选择特征
  - 编写一份字段、规则、理由齐全的数据清洗规范，并能在别人的数据中找出泄露特征
  quality:
  - 树立数据质量意识和规范意识，清洗规则先写成文档、评审后执行，做到可复查、可追溯
  - 遵守数据安全和个人信息保护规定，不把含个人信息的原始数据上传到公共服务
key_points:
- 数据质量检查与探索性数据分析
- 缺失值、异常值的处理与数据清洗规范
- 独热编码、标准化与归一化
- 先划分再预处理，识别数据泄露
difficulties:
- point: 为什么要“先划分、再预处理”，数据泄露为什么会让成绩虚高
  solution: 用“模型上线后只能用历史均值标准化新房子”说明道理；实验 2-3 现场演示加入单价后 R² 从 0.889 升到 0.997、目标编码测试成绩高于训练成绩，让学生自己找出泄露
- point: 异常值“找出”和“处理”的区别：学生倾向于把规则找出的值全部删除
  solution: IQR 找出的 106 套高价房中 74 套在天河，引导学生判断它们是真实数据；介绍“单价 × 面积 ≈ 总价”的业务校验法
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 2 章 数据预处理与特征工程的情景导入和第一节，操作交互动画“预处理流水线”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：小周刚进一家房产中介公司的数据部。经理交给他一个任务：公司想在 App 上推出“智能估价”功能，用户输入房子的区域、面积……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 15
    content: 2.1 数据质量与探索性数据分析：常见的数据质量问题、描述性统计与数据透视、用图形看分布、相关系数与相关性分析
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用描述统计、透视表和三种图快速发现数据问题，辛普森悖论说明相关不等于因果
  - name: 讲授
    minutes: 15
    content: 2.2 数据清洗：缺失值、异常值、重复值与不一致、数据清洗规范
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 以清洗规范为主线讲缺失、异常、重复的处理，对应训练师三级“制定数据清洗规范”考点
  - name: 讲授与演示
    minutes: 15
    content: 2.3 特征编码与特征缩放：类别型特征的编码、取值很多的类别怎么办、标准化与归一化、哪些算法需要缩放
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“预处理流水线”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 动画逐步演示编码和缩放，并演示漏掉某一步的后果，加深对处理顺序的理解
  - name: 讲授
    minutes: 10
    content: 2.4 特征构造与特征选择：特征构造、特征选择
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 从业务出发构造特征，比较三类特征选择方法
  - name: 讲授
    minutes: 18
    content: 2.5 数据集划分与数据泄露：先划分，再预处理、常见的数据泄露、怎样发现数据泄露
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 本章重点，用泄露案例让学生形成“预测时刻能不能拿到”的检查习惯
  - name: 实验
    minutes: 30
    content: 实验 2-1 认识一份真实数据：二手房数据探索
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 动手发现真实数据中的各类问题，为写清洗规范做准备；质量报告课后完成
  - name: 实验
    minutes: 50
    content: 实验 2-2 按规范清洗并编码
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 按规范执行清洗并输出 house_clean.csv，是第 3 章实验的数据基础
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 7
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 2.6 前沿视窗；完成实验 2-1 的数据质量报告；选做实验 2-3
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是数据泄露？列举三种常见的数据泄露，并说明怎样发现数据泄露。
- 简答题：比较标签编码和独热编码，说明各自适用的情况，并各举一个二手房数据中的例子。
- 简答题：某电商公司的数据中，“会员等级”字段有 8% 的缺失。请说明你会怎样决定处理方法，并给出至少两种可选方案及其适用条件。
- 实操题：对 `house_clean.csv` 中的“总价_万元”，分别用 3σ 法则和 IQR 法找出异常值，输出各自的数量、两种方法找出的记录有多少重合，以及 IQR 法找出的记录在各区的分布。写出关键代码、运行结果，并判断这些“异常值”应不应该删除。
- 实操题：修改实验 2-2 的缺失值处理，比较三种处理建成年份缺失的方法：按区域中位数填充、按整体中位数填充、删除训练集中有缺失的行（测试集仍按区域中位数填充）。用 28 个原始特征训练线性回归，输出每种方法的训练样本数和测试 R²。写出关键代码和结果，并分析差别大小的原因。
- 实验报告：实验 2-1、实验 2-2、实验 2-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
