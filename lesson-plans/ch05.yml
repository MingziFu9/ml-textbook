# 第 5 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 5
online: 4
offline: 5
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出决策树的结构和 ID3、C4.5、CART 三种算法选择划分特征的依据
  - 解释过拟合在决策树上的表现，以及 Bagging 和 Boosting 两条集成路线分别解决什么问题
  skill:
  - 计算一个小数据集的信息熵、信息增益和基尼系数，并用 scikit-learn 训练、可视化决策树
  - 比较单棵决策树、随机森林、XGBoost、LightGBM 在同一份数据上的效果、速度和可解释性，并用特征重要性分析影响结果的因素
  - 评价一个树模型是否过拟合，选择合适的剪枝和调参方法，并写出模型测试报告
  quality:
  - 养成“先看测试集、再信模型”的习惯，能如实报告复杂模型不如简单模型的结果
  - 理解自动化决策对个人权益的影响，知道《个人信息保护法》对算法解释和拒绝的要求
key_points:
- 决策树是怎样做决定的
- 选出最好的问题：信息熵、信息增益与基尼系数
- 回归树、过拟合与剪枝
- 集成学习：三个臭皮匠，顶个诸葛亮
difficulties:
- point: 信息熵和信息增益的含义与计算：公式里有对数，学生不清楚“纯度”和“信息量”怎样对应
  solution: 先用“一筐全是好苹果 vs 好坏各半”直观比较纯度，再用 15 行贷款数据一步步手算，最后在“决策树生长”动画里换特征看增益变化，实验 5-1 用代码复算核对
- point: Boosting 为什么要“拟合残差”、学习率为什么要调小
  solution: 用 3 套房价的残差例子板书 2 轮迭代，再用“Bagging 与 Boosting”动画对比学习率 1.0 和 0.1 的曲线；实验 5-3 观察早停轮数
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 5 章 决策树与集成学习的情景导入和第一节，操作交互动画“决策树生长”；课后阅读 5.7 前沿视窗
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：小林在一家城市商业银行做信贷审批。每天他要看几十份贷款申请：申请人多大年纪、有没有稳定工作、名下有没有房子、过去的信用记……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 5.1 决策树是怎样做决定的：从“二十个问题”说起、决策树的结构、决策树是怎样“学”出来的
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用学生熟悉的“二十个问题”游戏引出树结构，建立直观印象
  - name: 讲授与演示
    minutes: 20
    content: 5.2 选出最好的问题：信息熵、信息增益与基尼系数：纯度与信息熵、信息增益与 ID3 算法、信息增益率与 C4.5 算法、基尼系数与 CART 算法等
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“决策树生长”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 本章重点，手算 + 动画双通道突破难点，对应训练师“智能训练”考点
  - name: 讲授
    minutes: 10
    content: 5.3 回归树、过拟合与剪枝：回归树、决策树为什么容易过拟合、剪枝、决策树的优点和缺点
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 从“背答案”类比理解过拟合，为后面集成学习的动机做铺垫
  - name: 讲授
    minutes: 5
    content: 5.4 集成学习：三个臭皮匠，顶个诸葛亮：为什么“集体”比个人强、两条路线、投票法与 Stacking
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用投票概率计算说明集成为什么有效，引出两条路线
  - name: 讲授
    minutes: 10
    content: 5.5 随机森林：两种随机、袋外误差、特征重要性、主要参数
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 结合客户流失业务讲特征重要性，培养用模型解释业务的能力
  - name: 讲授与演示
    minutes: 15
    content: 5.6 Boosting：一棵树纠正上一棵的错：AdaBoost、梯度提升树、学习率与树的数量、XGBoost 和 LightGBM
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“Bagging 与 Boosting”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 对应 Python 技术应用工程师“集成学习”考点，动画帮助理解逐轮纠错
  - name: 实验
    minutes: 45
    content: 实验 5-1 手算信息增益并训练决策树
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 用 Python 复算 5.2 节的信息熵、信息增益、信息增益率和基尼系数，检验手算结果。
  - name: 实验
    minutes: 45
    content: 实验 5-2 随机森林预测客户流失
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 用随机森林预测电信客户是否流失，与逻辑回归、单棵决策树比较效果；读取袋外准确率，观察树的数量对效果的影响；用特征重要性解释流失原因。
  - name: 实验
    minutes: 45
    content: 实验 5-3 XGBoost 与 LightGBM 对比
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 比较随机森林、scikit-learn 梯度提升树、XGBoost、LightGBM 在同一份数据上的效果和训练速度。
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 5.7 前沿视窗，在讨论区回答“TabPFN 会不会取代 XGBoost”
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是过拟合？结合实验 5-1 的结果说明决策树为什么容易过拟合，以及可以怎样防止。
- 简答题：比较 Bagging 和 Boosting 两种集成思路的区别，各举一个代表算法。
- 简答题：某银行用梯度提升树自动审批信用卡申请。一位被拒绝的申请人要求银行说明理由。请说明银行可以怎样回应，以及这对模型选择有什么启示。
- 实操题：修改实验 5-1，在决策树参数中加入 criterion="entropy"，并让 max_depth 取 3 到 8，输出每个深度的测试集准确率，与默认的基尼系数比较。写出关键代码和运行结果，说明两种标准的差别大不大。
- 实操题：在实验 5-3 的基础上，用 LightGBM 最终模型的预测概率，把阈值从 0.1 到 0.9 每隔 0.05 取一个值，计算流失类的精确率和召回率，找出召回率不低于 0.7 时精确率最高的阈值，并写一段给运营部门的说明。
- 实验报告：实验 5-1、实验 5-2、实验 5-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
