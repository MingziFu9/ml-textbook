# 第 4 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 4
online: 4
offline: 5
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出逻辑回归、Sigmoid 函数、交叉熵、混淆矩阵、精确率、召回率、ROC 曲线和 AUC 的含义
  - 解释逻辑回归怎样把线性组合变成概率，分类阈值怎样影响精确率和召回率，类别不平衡时准确率为什么会误导人
  skill:
  - 运用 scikit-learn 训练逻辑回归，计算混淆矩阵和各项指标，画 ROC 和 PR 曲线，用类别权重、SMOTE 等方法处理不平衡数据
  - 分析逻辑回归的系数和错误案例，比较不同模型、不同阈值的优劣
  - 根据漏判和误判的业务代价选择阈值和方案，撰写一份完整的模型测试报告
  quality:
  - 树立“评价指标服务于业务”的意识，能从漏判、误判的实际后果出发权衡方案
  - 如实撰写模型测试报告，写清假设和局限；关注模型对不同人群的公平性
key_points:
- 逻辑回归的 Sigmoid 输出与交叉熵损失
- 混淆矩阵与准确率、精确率、召回率、F1 值
- 分类阈值的选择，ROC 曲线、AUC 与 PR 曲线
- 类别不平衡的处理与模型测试报告
difficulties:
- point: 精确率和召回率的区别，阈值变化时二者为什么此消彼长
  solution: 用客户经理的两个问题引入，在混淆矩阵上分别圈出两个分母；用“阈值、混淆矩阵与 ROC”动画把阈值从 0.9 拖到 0.1，记录漏诊和误诊例数
- point: 类别不平衡时准确率为什么会误导人，各种处理方法到底起了什么作用
  solution: 展示“全部判为正常”准确率 0.990；对比四种做法的 AUC、AP 几乎相同，说明处理方法主要改变判定门槛；最后用业务代价表选方案
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 4 章 逻辑回归与分类模型评估的情景导入和第一节，操作交互动画“阈值、混淆矩阵与 ROC”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 8
    content: 情景导入：小周的估价模型上线后，公司另一个部门找上门来。原来公司还承接了一家电信运营商的数据分析业务：运营商每个月都有不少客户销号……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 4.1 分类问题
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 明确二分类、正类等基本概念，指出“逻辑回归是分类模型”这一易错点
  - name: 讲授
    minutes: 20
    content: 4.2 逻辑回归：从线性回归到 Sigmoid、决策边界、交叉熵损失、系数解读等
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 从线性回归自然过渡到 Sigmoid 和交叉熵，用几率解读系数，为第 10 章 Softmax 做铺垫
  - name: 讲授
    minutes: 15
    content: 4.3 混淆矩阵与分类指标：混淆矩阵、准确率、精确率、召回率与 F1 值
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 本章重点，结合客户经理的问题计算四个指标，对应数据处理工程师“分类”考点
  - name: 讲授与演示
    minutes: 15
    content: 4.4 分类阈值、ROC 与 PR 曲线：阈值、ROC 曲线与 AUC、PR 曲线
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“阈值、混淆矩阵与 ROC”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 动画联动混淆矩阵与 ROC、PR 曲线，学会按业务代价选阈值
  - name: 讲授
    minutes: 15
    content: 4.5 类别不平衡：准确率陷阱、三类处理方法、按业务代价选方案
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用欺诈数据揭示准确率陷阱，比较三类处理方法和业务代价
  - name: 讲授
    minutes: 12
    content: 4.6 错误案例分析与模型测试报告：错误案例分析、模型测试报告
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 学习错误案例分析和测试报告的写法，对应训练师三级“撰写测试报告”考点
  - name: 实验
    minutes: 40
    content: 实验 4-1 电信客户流失预测
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 用 scikit-learn 训练逻辑回归，用 `predict_proba` 得到概率，用 `predict` 得到类
  - name: 实验
    minutes: 40
    content: 实验 4-2 阈值、混淆矩阵与 ROC
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 调整分类阈值，观察混淆矩阵、精确率、召回率的变化，体会二者此消彼长；画 ROC 曲线和 PR 曲线，计算 AUC 和 A
  - name: 实验
    minutes: 40
    content: 实验 4-3 类别不平衡：信用卡欺诈识别
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 比较不平衡处理方法并计算业务代价；测试报告课后完成
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告；阅读 4.7 前沿视窗；完成实验 4-3 的模型测试报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：分别以“垃圾短信拦截”和“癌症初筛”为例，说明精确率和召回率的含义，以及两个场景各应更重视哪个指标、阈值应调高还是调低。
- 简答题：什么是类别不平衡？为什么类别不平衡时不能只看准确率？列举三种处理方法，并说明使用时的注意事项。
- 简答题：某同学训练的客户流失模型测试集 AUC 为 0.84，他在报告中只写了一句“模型 AUC 达到 0.84，效果良好，建议上线”。请指出这份报告的不足，并说明一份完整的模型测试报告应包含哪些部分。
- 实操题：在实验 4-1 的基础上，分别计算阈值为 0.3、0.4、0.5 时的判为流失人数、精确率、召回率和 F1 值，再训练一个 `class_weight="balanced"` 的逻辑回归（阈值 0.5）做比较；最后按流失概率取前 150 名和前 300 名，统计各自的命中人数。写出关键代码和结果，并为“每月只能打 300 个电话”的客户经理推荐用法。
- '实操题：在实验 4-3 的基础上，把逻辑回归的 `class_weight` 设为 `{0: 1, 1: w}`，w 分别取 1、5、10、20、50、95，计算每种情况下的漏判笔数、误报笔数、召回率、精确率和总代价（误报每笔 20 元）。写出关键代码和结果，找出总代价最低的 w，并解释 w = 95 的结果为什么和 `"balanced"` 完全一样。'
- 实验报告：实验 4-1、实验 4-2、实验 4-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
